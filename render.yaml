services:
  - type: web
    name: sadhak-ai-server
    env: node
    region: ohio
    rootDir: apps/server
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        sync: false   # Set this in the Render dashboard
      - key: NVIDIA_API_KEY
        sync: false   # Set this in the Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false   # Set this in the Render dashboard
